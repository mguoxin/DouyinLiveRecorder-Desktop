[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlrecorder"
version = "0.4.0"
description = "轻量级抖音直播监控与录制工具（Windows 桌面版）"
requires-python = ">=3.12"
dependencies = [
    "PySide6-Essentials>=6.6",
    "httpx[http2]>=0.28.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6.22"]

[project.scripts]
dlrecorder = "dlrecorder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-v --tb=short"
